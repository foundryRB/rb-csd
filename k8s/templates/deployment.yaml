# A stateless static site (nginx over prebuilt HTML): default rolling update,
# no volumes, no env. The image is fully self-contained.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "cognitive-software-delivery.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.paused }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "cognitive-software-delivery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cognitive-software-delivery.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: site
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
